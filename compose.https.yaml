services:
  crm:
    environment:
      APP_ENV: production
      PUBLIC_URL: https://${CRM_DOMAIN:?Configura CRM_DOMAIN en .env.docker}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      crm:
        condition: service_healthy
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?Configura CRM_DOMAIN en .env.docker}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
