<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoRuta CRM</title>
<style>
:root{
  --bg:#f5f7f4; --surface:#ffffff; --surface-2:#eef2ec; --border:#dde3da;
  --text:#1c2420; --muted:#5d6b63; --brand:#1f7a4d; --brand-ink:#ffffff; --brand-soft:#e2f1e8;
  --warn:#9a6200; --warn-soft:#fbefd8; --danger:#b3261e; --danger-soft:#fbe4e2;
  --info:#1d5fa8; --info-soft:#e1ecf8; --ok:#1f7a4d; --ok-soft:#e2f1e8;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1a1f1c; --surface-2:#222a25; --border:#2f3933;
    --text:#e6ece8; --muted:#9aa8a0; --brand:#4cc38a; --brand-ink:#08130d; --brand-soft:#1d3428;
    --warn:#f0b54a; --warn-soft:#3a2d12; --danger:#f2867e; --danger-soft:#3d1c1a;
    --info:#7fb2ee; --info-soft:#18293d; --ok:#4cc38a; --ok-soft:#1d3428; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1c; --surface-2:#222a25; --border:#2f3933;
  --text:#e6ece8; --muted:#9aa8a0; --brand:#4cc38a; --brand-ink:#08130d; --brand-soft:#1d3428;
  --warn:#f0b54a; --warn-soft:#3a2d12; --danger:#f2867e; --danger-soft:#3d1c1a;
  --info:#7fb2ee; --info-soft:#18293d; --ok:#4cc38a; --ok-soft:#1d3428; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px}
.muted{color:var(--muted)} .small{font-size:12px}
.hidden{display:none!important}

.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:28px;max-width:420px;width:100%}
.login-card form{display:grid;gap:12px;margin-top:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;flex:none}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.nav button:hover{background:var(--surface-2)}
.nav button.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px;display:grid;gap:8px}
.role-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.role-badge.admin{background:var(--brand-soft);color:var(--brand)}
main{padding:24px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar{display:none}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.two{grid-template-columns:1.4fr 1fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.input,select.input,textarea.input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.search{max-width:280px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-danger{background:var(--danger-soft);color:var(--danger)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.bar-row{display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:99px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.err{background:var(--danger-soft);color:var(--danger)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;padding:22px;border-left:1px solid var(--border)}
.modal-wrap{justify-content:center;align-items:center;padding:16px;z-index:25}
.modal{background:var(--surface);border-radius:16px;width:min(680px,100%);max-height:92vh;overflow-y:auto;padding:22px;border:1px solid var(--border)}
.d-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface-2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-weight:600}
.decision{border-left:4px solid var(--brand)}
.decision.blocked{border-left-color:var(--danger)}
.decision.warn{border-left-color:var(--warn)}
.tl{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.tl:last-child{border-bottom:0}
.car{display:flex;gap:12px;align-items:center}
.car img{width:120px;height:78px;object-fit:cover;border-radius:8px;background:var(--surface-2);flex:none}
.reco{border:1px solid var(--brand);background:var(--brand-soft);border-radius:var(--radius);padding:12px}
.reco.warn{border-color:var(--warn);background:var(--warn-soft)}
.cat-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cat-card{padding:0;overflow:hidden}
.cat-card img{width:100%;height:150px;object-fit:cover;display:block;background:var(--surface-2)}
.cat-card .body{padding:14px}
.preview{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:13px;box-shadow:var(--shadow);max-width:90vw}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.stars label{display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;gap:8px;flex-wrap:wrap}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.modal.wide{width:min(760px,100%)}
.resp-row{cursor:pointer;border-radius:8px}
.resp-row:hover{background:var(--surface-2)}
.preview-frame{width:100%;height:72vh;border:1px solid var(--border);border-radius:10px;background:#eef3ee}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:30;width:240px;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  main{padding:16px}
  .two{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .search{max-width:none;flex:1}
  .drawer{padding:16px}
}
</style>
</head>
<body>
<div id="root"><div class="loading">Cargando…</div></div>

<script>
/* =========================================================
   EcoRuta CRM · interfaz (habla con server.pl)
   ========================================================= */
const CONCESIONARIO = 'EcoRuta Madrid';
const PLAZO_CORTO = 30;
const OPCIONES = {
  eventos:['Consulta','Visita concesionario','Solicitud prueba','Invitación test drive','Cita confirmada','Asesoramiento enviado','Encuesta enviada','Encuesta respondida','Llamada','Otro'],
  canalesInt:['Web','Visita','Evento','Email','Telefono','WhatsApp'],
};
const TIPOS_ENC = ['Satisfacción post-visita','Satisfacción post test drive','Interés en nuevo modelo'];
const SEGMENTOS = ['Listo para prueba','Cita confirmada','Asesorar carga','Revisar presupuesto','Revisar modelo','Lista de espera','En exploración','Sin permiso'];

let DATA = null;          // datos del servidor
let session = null;       // usuario con sesión
let view = 'panel';
let ui = {q:'', filtroSeg:'Todos', invFiltro:'visita', invSel:null, invFecha:'', encSel:new Set(), navOpen:false, loginErr:'', needsSetup:false, setupToken:false};

/* ---------- API ---------- */
async function api(method, path, body){
  let r;
  try{
    r = await fetch(path, {method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined, credentials:'same-origin'});
  }catch(_){
    throw new Error('No se pudo conectar con el servidor del CRM. Comprueba la conexión y vuelve a intentarlo.');
  }
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(r.status === 401 && !['/api/login','/api/setup'].includes(path)){ session = null; DATA = null; closeDrawer(); closeModal(); render(); throw new Error(j.error || 'Sesión caducada'); }
  if(!r.ok){ const e = new Error(j.error || ('Error ' + r.status)); e.data = j; throw e; }
  return j;
}
async function refresh(){ applyData(await api('GET','/api/data')); }
function applyData(d){
  DATA = d;
  session = DATA.me;
  DATA.clientes.forEach(c=>{ c.presupuesto = Number(c.presupuesto); c.compraDias = Number(c.compraDias); });
  DATA.catalogo.forEach(v=>{ v.precio = Number(v.precio); });
}
async function boot(){
  if(location.protocol === 'file:'){
    $('#root').innerHTML = `<div class="login"><div class="login-card"><div class="logo"><div class="logo-mark">E</div>EcoRuta CRM</div>
      <p style="margin-top:14px">Abre el CRM desde la dirección de tu servidor. En local puedes arrancarlo con Docker Compose o con <b>iniciar-crm.command</b> en macOS.</p></div></div>`;
    return;
  }
  try{ await refresh(); }
  catch(e){
    try{
      const estado = await api('GET','/api/estado');
      ui.needsSetup = estado.necesitaConfiguracion;
      ui.setupToken = estado.requiereTokenConfiguracion;
    }catch(err){ ui.loginErr = err.message; }
  }
  render();
}

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:'always'}).format(n);
const fdate = iso => new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const nombreC = c => `${c.nombre} ${c.apellido}`;
const isAdmin = () => session && session.rol === 'admin';
const initials = n => n.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
const vehiculo = id => DATA.catalogo.find(v=>v.id===id);
const intsDe = id => DATA.interacciones.filter(i=>i.clienteId===id).sort((a,b)=>a.fecha.localeCompare(b.fecha) || a.id-b.id);
const asesores = () => DATA.usuarios.filter(u=>u.rol==='estandar');
const REF_POR_TEC = {BEV:'V04',PHEV:'V07',HEV:'V01'};
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function visitoConcesionario(c){ return c.origen==='Visita' || intsDe(c.id).some(i=>i.canal==='Visita' || i.evento==='Visita concesionario'); }
const pill = (t,tono) => `<span class="pill p-${tono}">${esc(t)}</span>`;
const prioPill = p => pill(p, p==='Alta'?'danger':p==='Media'?'warn':'mute');
const ESTADO_ENVIO = {enviado:['Enviado','ok'], error:['Error','danger'], omitido:['No enviado','mute'], sin_permiso:['Bloqueado GDPR','danger'], no_solicitado:['Sin enviar','mute']};
const envioPill = e => { const [t,c] = ESTADO_ENVIO[e] || [e,'mute']; return pill(t,c); };
async function busy(btn, fn){ const txt = btn?.textContent; if(btn){ btn.disabled = true; btn.textContent = 'Procesando…'; } try{ return await fn(); } finally{ if(btn && btn.isConnected){ btn.disabled = false; btn.textContent = txt; } } }

/* =========================================================
   MOTOR DE RECOMENDACIÓN (reglas en orden, hoja Guía §6–7)
   ========================================================= */
function motor(c){
  const v = vehiculo(c.vehiculo) || vehiculo(REF_POR_TEC[c.tecnologia]);
  const ints = intsDe(c.id);
  const solicitud = ints.some(i=>i.evento==='Solicitud prueba');
  const cita = ints.some(i=>i.evento==='Cita confirmada');
  const invitado = ints.some(i=>i.evento==='Invitación test drive');
  const tecOk = v.tec === c.tecnologia;
  const cargaOk = c.tecnologia === 'HEV' || c.carga === 'Si';
  const margen = c.presupuesto - v.precio;
  const presOk = margen >= 0;
  const alternativas = DATA.catalogo.filter(x=>x.tec===c.tecnologia && x.precio<=c.presupuesto).length;
  const plazoCorto = c.compraDias <= PLAZO_CORTO;
  const prioridad = c.compraDias<=30 ? 'Alta' : c.compraDias<=60 ? 'Media' : 'Baja';
  const base = {v, margen, presOk, cargaOk, tecOk, alternativas, prioridad, solicitud, cita, invitado, plazoCorto};
  if(c.permiso !== 'Si') return {...base, segmento:'Sin permiso', accion:'No iniciar seguimiento comercial', plazo:'No aplica', tono:'danger', regla:'1. Filtro legal (GDPR): sin permiso de contacto.'};
  if(cita) return {...base, segmento:'Cita confirmada', accion:'Preparar prueba ya acordada', plazo:'Según cita registrada', tono:'info', regla:'Existe una cita confirmada en el historial.'};
  if(!tecOk) return {...base, segmento:'Revisar modelo', accion:`Revisar vehículo: el elegido es ${v.tec} y el cliente prefiere ${c.tecnologia}`, plazo:'En 3 días', tono:'warn', regla:'Modelo incompatible con la tecnología preferida.'};
  if(!cargaOk) return {...base, segmento:'Asesorar carga', accion:'Aclarar carga y comparar opciones con cliente', plazo:'En 3 días', tono:'warn', regla:`4. Compatibilidad de carga: ${c.tecnologia} con carga "${c.carga}".`};
  if(!presOk) return {...base, segmento:'Revisar presupuesto', accion: alternativas ? `Proponer alternativa ${c.tecnologia} dentro del presupuesto (${alternativas} opción/es)` : 'Proponer financiación o tecnología alternativa', plazo:'En 3 días', tono:'warn', regla:'3. Viabilidad financiera: presupuesto menor que el precio de referencia.'};
  if(solicitud && plazoCorto){
    if(!v.disponible) return {...base, segmento:'Lista de espera', accion:`Unidad ${v.id} no disponible: ofrecer fecha alternativa`, plazo:'En 24 horas', tono:'warn', regla:'5. Flota test drive: unidad no disponible hoy.'};
    return {...base, segmento:'Listo para prueba', accion:`Invitar a prueba ${c.tecnologia}`, plazo:'En 24 horas', tono:'ok', regla:'Solicitó prueba, compra en ≤30 días y cumple carga y presupuesto.'};
  }
  return {...base, segmento:'En exploración', accion:`Enviar comparativa ${c.tecnologia} y acordar seguimiento`, plazo:'En 3 días', tono:'mute', regla: solicitud ? 'Solicitó prueba pero su plazo de compra supera 30 días.' : 'Aún no ha solicitado prueba.'};
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const root = $('#root');
  if(!session || !DATA){ root.innerHTML = ui.needsSetup ? setupView() : loginView(); $('#root input')?.focus(); return; }
  const navItems = isAdmin()
    ? [['panel','Panel'],['clientes','Clientes'],['invitaciones','Invitaciones test drive'],['encuestas','Encuestas'],['catalogo','Catálogo'],['equipo','Equipo y correo']]
    : [['panel','Mi panel'],['clientes','Mis clientes'],['catalogo','Catálogo']];
  if(!navItems.some(n=>n[0]===view)) view='panel';
  const pages = {panel:panelView, clientes:clientesView, invitaciones:invitacionesView, encuestas:encuestasView, catalogo:catalogoView, equipo:equipoView};
  root.innerHTML = `
  <div class="topbar"><button class="btn sm" data-act="nav-toggle" aria-label="Menú">☰</button><div class="logo"><div class="logo-mark">E</div>EcoRuta CRM</div></div>
  <div class="app">
    <aside class="side ${ui.navOpen?'open':''}">
      <div class="logo"><div class="logo-mark">E</div>EcoRuta CRM</div>
      <nav class="nav">${navItems.map(([k,l])=>`<button class="${view===k?'active':''}" data-nav="${k}">${l}${k==='panel'&&noLeidas()?`<span class="badge" title="Respuestas nuevas">${noLeidas()}</span>`:''}</button>`).join('')}</nav>
      <div class="side-foot">
        <div style="display:flex;gap:10px;align-items:center"><div class="avatar">${esc(initials(session.nombre))}</div><div style="min-width:0"><div style="font-weight:600">${esc(session.nombre)}</div><span class="role-badge ${isAdmin()?'admin':''}">${isAdmin()?'Administrador':'Usuario estándar'}</span></div></div>
        <button class="btn sm" data-act="logout">Cerrar sesión</button>
      </div>
    </aside>
    <main>${pages[view]()}</main>
  </div>`;
}

function loginView(){
  return `<div class="login"><div class="login-card">
    <div class="logo"><div class="logo-mark">E</div>EcoRuta CRM</div>
    <p class="muted" style="margin:10px 0 0">Inicia sesión con tu cuenta de ${CONCESIONARIO}.</p>
    <form data-form="login">
      <div class="field"><label for="l-email">Correo electrónico</label><input id="l-email" class="input" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pass">Contraseña</label><input id="l-pass" class="input" name="password" type="password" autocomplete="current-password" required></div>
      ${ui.loginErr?`<div class="note err">${esc(ui.loginErr)}</div>`:''}
      <button class="btn primary">Entrar</button>
    </form>
    <p class="small muted" style="margin:14px 0 0">¿No tienes acceso? Pide al administrador que te cree un usuario.</p>
  </div></div>`;
}
function setupView(){
  return `<div class="login"><div class="login-card">
    <div class="logo"><div class="logo-mark">E</div>EcoRuta CRM</div>
    <h2 style="margin-top:16px">Crear cuenta de administrador</h2>
    <p class="muted small" style="margin:4px 0 0">Primer arranque: crea la cuenta que gestionará clientes, invitaciones, encuestas y usuarios.</p>
    <form data-form="setup">

/* ---------- Panel ---------- */
function panelView(){

  const invitados = new Set(DATA.interacciones.filter(i=>i.evento==='Invitación test drive').map(i=>i.clienteId));
  const conCita = new Set(DATA.interacciones.filter(i=>i.evento==='Cita confirmada').map(i=>i.clienteId));
  const citasDeInvitados = [...conCita].filter(id=>invitados.has(id)).length;
  const conv = invitados.size ? Math.round(citasDeInvitados/invitados.size*100)+'%' : '—';
  const resp = DATA.encuestas.filter(e=>e.estado==='Respondida');
  const satis = resp.length ? (resp.reduce((s,e)=>s+Number(e.respuestas.satisfaccion),0)/resp.length).toFixed(1) : '—';

  const max = Math.max(1,...SEGMENTOS.map(count));

      ${pendientes.map(({c,m})=>`<tr class="click" data-open="${c.id}"><td><b>${esc(nombreC(c))}</b><div class="small muted">${c.id} · ${esc(c.asesor)}</div></td><td>${prioPill(m.prioridad)}</td><td>${esc(m.accion)}</td><td class="small">${esc(m.plazo)}</td></tr>`).join('')}

let recoTimer = null, recoSeq = 0;
function pedirRecomendacion(){
  clearTimeout(recoTimer);
  recoTimer = setTimeout(async ()=>{
    const f = $('[data-form="cliente"]'); const box = $('#reco-box'); if(!f || !box) return;
    const tecnologia = f.elements.tecnologia.value, presupuesto = Number(f.elements.presupuesto.value), carga = f.elements.carga.value;
    if(!presupuesto){ box.innerHTML = '<div class="note">Indica tecnología y presupuesto para ver el vehículo recomendado.</div>'; return; }
    const seq = ++recoSeq;
    try{
      const r = await api('POST','/api/recomendar',{tecnologia,presupuesto,carga});
      if(seq !== recoSeq || !$('#reco-box')) return;
      box.innerHTML = recoCard(r, f.elements.vehiculo.value);
    }catch(e){ box.innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
  }, 250);
}
function recoCard(r, manual){
  if(!r.vehiculo) return `<div class="note warn">${esc(r.motivo)}</div>`;
  const v = r.vehiculo, ok = r.estado==='ok';
  const man = manual && manual !== v.id ? vehiculo(manual) : null;
  return `<div class="reco ${ok?'':'warn'}">
    <div class="small muted" style="margin-bottom:6px">Recomendación del catálogo para el test drive</div>
    <div class="car"><img src="img/${v.id}.jpg" alt="${esc(v.modelo)}">
      <div><b>${esc(v.modelo)}</b> <span class="small muted">${v.id} · ${esc(v.version)}</span>
        <div>${eur(v.precio)} · ${esc(v.tec)} · margen <b>${eur(r.margen)}</b></div>
        <div class="small">${esc(r.motivo)}</div>
        ${r.aviso?`<div class="small" style="color:var(--warn)">${esc(r.aviso)}</div>`:''}
        ${r.alternativas.length>1?`<div class="small muted">También caben: ${r.alternativas.filter(a=>a.id!==v.id).map(a=>esc(a.modelo)+' ('+eur(a.precio)+')').join(', ')}</div>`:''}
        ${r.estado==='presupuesto' && r.otraTecnologia?`<div class="small muted">Alternativa en otra tecnología dentro del presupuesto: ${esc(r.otraTecnologia.modelo)} (${esc(r.otraTecnologia.tec)}, ${eur(r.otraTecnologia.precio)})</div>`:''}
      </div></div>
    ${man?`<div class="small" style="margin-top:8px">Has elegido manualmente <b>${esc(man.modelo)}</b>: se usará ese en lugar del recomendado.</div>`:''}
  </div>`;
}

async function guardarCliente(form){
  const f = Object.fromEntries(new FormData(form));
  f.enviarInvitacion = !!form.elements.enviarInvitacion?.checked;
  const id = form.dataset.id;
  const btn = form.querySelector('button.primary');
  form.querySelector('.err-box').innerHTML = '';
  try{
    const r = await busy(btn, ()=> id ? api('PUT','/api/clientes/'+id, f) : api('POST','/api/clientes', f));
    await refresh();
    closeModal(); render();
    if(id){ toast('Cliente actualizado'); if(openDrawerId) openDrawer(openDrawerId); }
    else openModal(resultadoAlta(r));
  }catch(e){
    const errs = e.data?.errores || [e.message];
    form.querySelector('.err-box').innerHTML = `<div class="note err">${errs.map(esc).join('<br>')}</div>`;
  }
}

function rellenar(tpl,c,m){

/* =========================================================
   Drawer / modal
   ========================================================= */
let openDrawerId = null;
function openDrawer(id){
  closeDrawerEl(); openDrawerId = id;
  const o = document.createElement('div'); o.className='overlay'; o.id='drawer';
  o.innerHTML = `<div class="drawer">${fichaView(id)}</div>`;
  o.addEventListener('click',e=>{ if(e.target===o) closeDrawer(); });
  document.body.appendChild(o);
}
function closeDrawerEl(){ $('#drawer')?.remove(); }
function closeDrawer(){ closeDrawerEl(); openDrawerId=null; }
function openModal(html, size){
  closeModal();
  const o = document.createElement('div'); o.className='overlay modal-wrap'; o.id='modal';
  o.innerHTML = `<div class="modal ${size==='wide'?'wide':''}">${html}</div>`;
  o.addEventListener('click',e=>{ if(e.target===o) closeModal(); });
  document.body.appendChild(o);
}
function closeModal(){ $('#modal')?.remove(); }
function refreshDrawer(){ if(openDrawerId){ const d=$('#drawer .drawer'); if(d){ const st=d.scrollTop; d.innerHTML=fichaView(openDrawerId); d.scrollTop=st; } } }
async function formErr(form, fn){
  const box = form.querySelector('.err-box'); if(box) box.innerHTML='';
  try{ await busy(form.querySelector('button.primary, button:not([type])'), fn); return true; }
  catch(e){ if(box) box.innerHTML = `<div class="note err">${esc(e.message)}</div>`; else toast(e.message); return false; }
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('click', async e=>{
  const t = e.target.closest('[data-nav],[data-act],[data-open],[data-edit],[data-survey],[data-invfiltro],[data-invone],[data-encresp],[data-toggle-td],[data-acceso],[data-del]');
  if(!t || t.disabled) return;
  const d = t.dataset;
  if(d.nav){ view=d.nav; ui.navOpen=false; ui.q=''; ui.filtroSeg='Todos'; render(); window.scrollTo(0,0); return; }
  if(d.open){ e.preventDefault(); closeModal(); openDrawer(d.open); return; }
  if(d.edit){ openModal(clienteForm(DATA.clientes.find(c=>c.id===d.edit))); pedirRecomendacion(); return; }
  if(d.del){
    const c = DATA.clientes.find(x=>x.id===d.del); if(!c) return;
    const nInt = intsDe(c.id).length, nEnc = DATA.encuestas.filter(x=>x.clienteId===c.id).length;
    openModal(`<div class="d-head"><div><h2>¿Eliminar a ${esc(nombreC(c))}?</h2><div class="small muted">${c.id} · ${esc(c.email)}</div></div><button class="x" data-act="close-modal">×</button></div>
      <p>Se borrará <b>definitivamente</b> su perfil, su historial (${nInt} interacciones), sus encuestas (${nEnc}), sus enlaces de respuesta y el registro de correos enviados.</p>
      <div class="note err">Esta acción no se puede deshacer.</div>
      <div class="form-foot"><button class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" style="background:var(--danger);border-color:var(--danger)" data-act="del-confirm" data-id="${c.id}">Eliminar definitivamente</button></div>`);
    return;
  }
  if(d.survey){ openModal(encuestaRapida(d.survey)); return; }
  if(d.invfiltro){ ui.invFiltro=d.invfiltro; ui.invSel=null; render(); return; }
  if(d.invone){ enviarInvitaciones([d.invone], t); return; }
  if(d.encresp){ openModal(encRespForm(DATA.encuestas.find(x=>x.id===d.encresp))); return; }
  if(d.acceso){ openModal(accesoForm(DATA.usuarios.find(u=>String(u.id)===d.acceso))); return; }
  if(d.toggleTd){ const v=vehiculo(d.toggleTd); try{ await api('POST',`/api/catalogo/${v.id}/disponible`,{disponible:!v.disponible}); await refresh(); render(); }catch(err){ toast(err.message); } return; }
  switch(d.act){
    case 'logout': try{ await api('POST','/api/logout',{}); }catch(_){} session=null; DATA=null; ui.loginErr=''; closeDrawer(); closeModal(); render(); break;
    case 'nav-toggle': ui.navOpen=!ui.navOpen; render(); break;
    case 'close': closeDrawer(); break;
    case 'close-modal': closeModal(); break;
    case 'new-client': openModal(clienteForm(null)); break;
    case 'export': exportCSV(); break;
    case 'del-confirm': {
      const id = d.id;
      try{ await busy(t, ()=>api('DELETE','/api/clientes/'+id)); closeModal(); closeDrawer(); await refresh(); render(); toast(`Cliente ${id} eliminado`); }
      catch(err){ toast(err.message); }
      break;
    }
    case 'leidas': try{ await api('POST','/api/respuestas/leidas',{}); await refresh(); render(); }catch(err){ toast(err.message); } break;
    case 'inv-preview': {
      const p = invCandidatos().find(({c,m})=>ui.invSel.has(c.id)&&elegibleInv(c,m)); if(!p) break;
      try{ await api('PUT','/api/plantilla',{plantilla:DATA.plantillaInvitacion}); }catch(_){}
      const src = `/api/correo/vista-previa?cliente=${encodeURIComponent(p.c.id)}&fecha=${encodeURIComponent(ui.invFecha||'')}`;
      openModal(`<div class="d-head"><div><h2>Así verá el correo ${esc(nombreC(p.c))}</h2><div class="small muted">Vista previa con su vehículo recomendado. El botón no funciona en la vista previa.</div></div><button class="x" data-act="close-modal">×</button></div><iframe class="preview-frame" src="${esc(src)}" title="Vista previa del correo"></iframe>`, 'wide');
      break;
    }
    case 'inv-send': enviarInvitaciones(invCandidatos().filter(({c,m})=>ui.invSel.has(c.id)&&elegibleInv(c,m)).map(({c})=>c.id), t); break;
    case 'enc-send': dispararEncuesta([...ui.encSel], $('#enc-tipo').value, t); break;
    case 'enc-quick': dispararEncuesta([d.id], $('#encq-tipo').value, t); break;
  }
});
document.addEventListener('change', async e=>{
  const t = e.target, d = t.dataset;
  if(d.invsel){ t.checked ? ui.invSel.add(d.invsel) : ui.invSel.delete(d.invsel); render(); }
  else if(d.act==='inv-all'){ const el = invCandidatos().filter(({c,m})=>elegibleInv(c,m)).map(({c})=>c.id); ui.invSel = new Set(t.checked?el:[]); render(); }
  else if(d.encsel){ t.checked ? ui.encSel.add(d.encsel) : ui.encSel.delete(d.encsel); render(); }
  else if(d.input==='filtroSeg'){ ui.filtroSeg=t.value; render(); }
  else if(d.input==='invFecha'){ ui.invFecha=t.value; render(); }
  else if(d.input==='plantilla'){ try{ await api('PUT','/api/plantilla',{plantilla:t.value}); toast('Plantilla guardada'); }catch(err){ toast(err.message); } }
  else if(t.form?.dataset.form==='cliente' && ['tecnologia','carga','vehiculo'].includes(t.name)) pedirRecomendacion();
});
document.addEventListener('input', e=>{
  const t = e.target, d = t.dataset;
  if(d.input==='q'){ ui.q=t.value; const pos=t.selectionStart; render(); const n=$('[data-input="q"]'); n.focus(); n.setSelectionRange(pos,pos); }
  if(d.input==='plantilla'){ DATA.plantillaInvitacion=t.value;
    const p = invCandidatos().find(({c,m})=>ui.invSel.has(c.id)&&elegibleInv(c,m)); if(p) $('#inv-preview').textContent = rellenar(DATA.plantillaInvitacion,p.c,p.m); }
  if(t.form?.dataset.form==='cliente' && t.name==='presupuesto') pedirRecomendacion();
});
document.addEventListener('submit', async e=>{
  const f = e.target; e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  switch(f.dataset.form){
    case 'login':
    case 'setup': {
      const btn = f.querySelector('button');
      try{
        await busy(btn, ()=>api('POST', f.dataset.form==='login'?'/api/login':'/api/setup', v));
        ui.loginErr=''; ui.needsSetup=false; view='panel'; ui.invSel=null; await refresh(); render();
      }catch(err){ ui.loginErr = err.message; render(); }
      break;
    }
    case 'cliente': guardarCliente(f); break;
    case 'interaccion':
      if(await formErr(f, ()=>api('POST','/api/interacciones',{clienteId:f.dataset.id, ...v}))){ toast('Interacción registrada'); await refresh(); render(); refreshDrawer(); }
      break;
    case 'encresp':
      if(await formErr(f, ()=>api('POST',`/api/encuestas/${f.dataset.id}/respuesta`, v))){ closeModal(); toast('Respuesta guardada'); await refresh(); render(); refreshDrawer(); }
      break;
    case 'usuario':
      if(await formErr(f, ()=>api('POST','/api/usuarios', v))){ toast('Usuario añadido'); await refresh(); render(); }
      break;
    case 'acceso':
      if(await formErr(f, ()=>api('PUT',`/api/usuarios/${f.dataset.id}/acceso`, v))){ closeModal(); toast('Acceso actualizado'); await refresh(); render(); }
      break;
    case 'test-email': {
      const btn = f.querySelector('button');
      try{ await busy(btn, ()=>api('POST','/api/correo/prueba', v)); toast('Correo de prueba enviado a '+v.to); }catch(err){ toast(err.message); }
      break;
    }
  }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#modal')) closeModal(); else closeDrawer(); } });

function exportCSV(){
  const cols = ['id','nombre','apellido','telefono','email','origen','permiso','canal','tecnologia','presupuesto','compraDias','carga','asesor','vehiculo'];
  const rows = DATA.clientes.map(c=>{ const m=motor(c); return [...cols.map(k=>c[k]), m.segmento, m.accion, m.plazo, m.prioridad]; });
  const campoCSV = v => {
    const raw = String(v ?? '');
    // Las hojas de cálculo pueden interpretar entradas de clientes como fórmulas.
    const text = /^[\s\uFEFF]*[=+@-]|^[\t\r\n]/u.test(raw) ? "'" + raw : raw;
    return '"' + text.replace(/"/g, '""') + '"';
  };
  const csv = [[...cols,'segmento','accion','plazo','prioridad'],...rows].map(r=>r.map(campoCSV).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'})); a.download='clientes_ecoruta.csv'; a.click();
}

/* Comprueba cada 20 s si hay respuestas nuevas de clientes y avisa */
setInterval(async ()=>{
  if(!session || !DATA || document.hidden) return;
  try{
    const antes = new Set((DATA.respuestas||[]).map(r=>r.id));
    const d = await api('GET','/api/data');
    const nuevas = (d.respuestas||[]).filter(r=>!antes.has(r.id));
    const editando = $('#modal') || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
    applyData(d);
    if(nuevas.length){
      const c = DATA.clientes.find(x=>x.id===nuevas[0].clienteId);
      toast(nuevas.length===1 ? `Nueva respuesta de ${c?nombreC(c):nuevas[0].clienteId}: ${nuevas[0].resumen}` : `${nuevas.length} respuestas nuevas de clientes`);
    }
    if(!editando){ render(); refreshDrawer(); }
  }catch(_){}
}, 20000);

boot();
</script>
